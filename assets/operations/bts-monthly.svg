<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Monthly checklist">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#ffeec5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgM)"/>
  <!-- clipboard -->
  <rect x="170" y="60" width="260" height="300" rx="14" fill="#fff" stroke="#214098" stroke-width="3"/>
  <rect x="240" y="48" width="120" height="28" rx="8" fill="#214098"/>
  <text x="300" y="68" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="14">MONTHLY</text>
  <!-- list rows -->
  <g font-family="Arial,sans-serif">
    <g transform="translate(195 105)">
      <rect width="20" height="20" rx="4" fill="#ec418c"/>
      <path d="M 4 10 L 9 15 L 16 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="32" y="6" width="180" height="10" rx="2" fill="#214098"/>
    </g>
    <g transform="translate(195 145)">
      <rect width="20" height="20" rx="4" fill="#ec418c"/>
      <path d="M 4 10 L 9 15 L 16 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="32" y="6" width="160" height="10" rx="2" fill="#214098"/>
    </g>
    <g transform="translate(195 185)">
      <rect width="20" height="20" rx="4" fill="#ec418c"/>
      <path d="M 4 10 L 9 15 L 16 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="32" y="6" width="200" height="10" rx="2" fill="#214098"/>
    </g>
    <g transform="translate(195 225)">
      <rect width="20" height="20" rx="4" fill="#fff" stroke="#214098" stroke-width="2"/>
      <rect x="32" y="6" width="170" height="10" rx="2" fill="#cfd6e8"/>
    </g>
    <g transform="translate(195 265)">
      <rect width="20" height="20" rx="4" fill="#fff" stroke="#214098" stroke-width="2"/>
      <rect x="32" y="6" width="140" height="10" rx="2" fill="#cfd6e8"/>
    </g>
    <g transform="translate(195 305)">
      <rect width="20" height="20" rx="4" fill="#fff" stroke="#214098" stroke-width="2"/>
      <rect x="32" y="6" width="190" height="10" rx="2" fill="#cfd6e8"/>
    </g>
  </g>
  <!-- pencil -->
  <g transform="translate(440 250) rotate(35)">
    <rect x="0" y="0" width="24" height="120" fill="#f2be58" stroke="#214098" stroke-width="2"/>
    <polygon points="0,0 24,0 12,-26" fill="#214098"/>
    <rect x="0" y="100" width="24" height="14" fill="#ec418c"/>
  </g>
  <!-- gear -->
  <g transform="translate(110 280)" fill="#214098">
    <circle r="22"/>
    <circle r="9" fill="#fff5f9"/>
    <g>
      <rect x="-4" y="-30" width="8" height="10" rx="2"/>
      <rect x="-4" y="20" width="8" height="10" rx="2"/>
      <rect x="-30" y="-4" width="10" height="8" rx="2"/>
      <rect x="20" y="-4" width="10" height="8" rx="2"/>
    </g>
  </g>
</svg>

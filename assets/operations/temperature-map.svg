<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Temperature key map">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff0ff"/>
      <stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <linearGradient id="thermo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ec418c"/>
      <stop offset="0.5" stop-color="#f2be58"/>
      <stop offset="1" stop-color="#214098"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgT)"/>
  <!-- thermometer -->
  <g transform="translate(140 60)">
    <rect x="-18" y="0" width="36" height="240" rx="18" fill="#fff" stroke="#214098" stroke-width="4"/>
    <rect x="-10" y="20" width="20" height="220" rx="10" fill="url(#thermo)"/>
    <circle cx="0" cy="280" r="34" fill="#ec418c" stroke="#214098" stroke-width="4"/>
    <!-- ticks -->
    <g stroke="#214098" stroke-width="2">
      <line x1="20" y1="40" x2="32" y2="40"/>
      <line x1="20" y1="80" x2="32" y2="80"/>
      <line x1="20" y1="120" x2="32" y2="120"/>
      <line x1="20" y1="160" x2="32" y2="160"/>
      <line x1="20" y1="200" x2="32" y2="200"/>
    </g>
  </g>
  <!-- temperature pills -->
  <g font-family="Arial,sans-serif" font-weight="700">
    <g transform="translate(260 90)">
      <rect width="240" height="46" rx="23" fill="#214098"/>
      <text x="20" y="29" fill="#fff" font-size="14">🍦 Vetrina gelato</text>
      <text x="220" y="29" text-anchor="end" fill="#f2be58" font-size="16">-14/-15°C</text>
    </g>
    <g transform="translate(260 150)">
      <rect width="240" height="46" rx="23" fill="#ec418c"/>
      <text x="20" y="29" fill="#fff" font-size="14">🥶 Vertical display</text>
      <text x="220" y="29" text-anchor="end" fill="#fff" font-size="16">-16°C</text>
    </g>
    <g transform="translate(260 210)">
      <rect width="240" height="46" rx="23" fill="#f2be58"/>
      <text x="20" y="29" fill="#214098" font-size="14">🧊 Treat freezer</text>
      <text x="220" y="29" text-anchor="end" fill="#214098" font-size="16">≤ -14°C</text>
    </g>
    <g transform="translate(260 270)">
      <rect width="240" height="46" rx="23" fill="#fff" stroke="#214098" stroke-width="2"/>
      <text x="20" y="29" fill="#214098" font-size="14">❄️ Frigorifero</text>
      <text x="220" y="29" text-anchor="end" fill="#ec418c" font-size="16">max +7°C</text>
    </g>
  </g>
</svg>

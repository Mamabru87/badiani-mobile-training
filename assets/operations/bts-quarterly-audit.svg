<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Quarterly audit">
  <defs>
    <linearGradient id="bgQ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5e6f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgQ)"/>
  <!-- chart -->
  <rect x="80" y="120" width="280" height="220" rx="14" fill="#fff" stroke="#214098" stroke-width="3"/>
  <line x1="100" y1="320" x2="340" y2="320" stroke="#214098" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="140" stroke="#214098" stroke-width="2"/>
  <!-- bars -->
  <rect x="125" y="240" width="34" height="80" fill="#f2be58"/>
  <rect x="175" y="200" width="34" height="120" fill="#214098"/>
  <rect x="225" y="170" width="34" height="150" fill="#ec418c"/>
  <rect x="275" y="150" width="34" height="170" fill="#214098"/>
  <!-- labels -->
  <g font-family="Arial,sans-serif" fill="#214098" font-size="13" font-weight="700" text-anchor="middle">
    <text x="142" y="345">Q1</text>
    <text x="192" y="345">Q2</text>
    <text x="242" y="345">Q3</text>
    <text x="292" y="345">Q4</text>
  </g>
  <text x="220" y="100" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-weight="700" font-size="20">QUARTERLY AUDIT</text>
  <!-- magnifying glass -->
  <g transform="translate(450 200)">
    <circle r="60" fill="#fff" stroke="#214098" stroke-width="6"/>
    <line x1="42" y1="42" x2="90" y2="90" stroke="#214098" stroke-width="10" stroke-linecap="round"/>
    <text y="6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#ec418c">★★★★</text>
  </g>
  <!-- award badge -->
  <g transform="translate(120 90)">
    <polygon points="0,-20 6,-7 20,-5 9,4 12,18 0,11 -12,18 -9,4 -20,-5 -6,-7" fill="#f2be58" stroke="#214098" stroke-width="2"/>
  </g>
</svg>

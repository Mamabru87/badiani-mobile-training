<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="FIFO First In First Out">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5f9"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgF)"/>
  <!-- shelf -->
  <rect x="60" y="240" width="480" height="14" fill="#214098"/>
  <rect x="80" y="254" width="10" height="40" fill="#214098"/>
  <rect x="510" y="254" width="10" height="40" fill="#214098"/>
  <!-- old box (front, going out left) -->
  <g transform="translate(110 170)">
    <rect width="80" height="70" rx="6" fill="#ec418c" stroke="#214098" stroke-width="2"/>
    <rect x="10" y="14" width="60" height="14" rx="2" fill="#fff"/>
    <text x="40" y="25" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-size="9" font-weight="700">OLDEST</text>
    <rect x="10" y="36" width="60" height="6" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="10" y="48" width="40" height="6" rx="2" fill="#fff" opacity="0.7"/>
  </g>
  <!-- middle -->
  <g transform="translate(220 170)">
    <rect width="80" height="70" rx="6" fill="#f2be58" stroke="#214098" stroke-width="2"/>
    <rect x="10" y="14" width="60" height="14" rx="2" fill="#fff"/>
    <text x="40" y="25" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-size="10" font-weight="700">DAY 2</text>
  </g>
  <g transform="translate(330 170)">
    <rect width="80" height="70" rx="6" fill="#f2be58" stroke="#214098" stroke-width="2"/>
    <rect x="10" y="14" width="60" height="14" rx="2" fill="#fff"/>
    <text x="40" y="25" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-size="10" font-weight="700">DAY 1</text>
  </g>
  <!-- new (back) -->
  <g transform="translate(440 170)">
    <rect width="80" height="70" rx="6" fill="#214098" stroke="#214098" stroke-width="2"/>
    <rect x="10" y="14" width="60" height="14" rx="2" fill="#fff"/>
    <text x="40" y="25" text-anchor="middle" fill="#ec418c" font-family="Arial,sans-serif" font-size="9" font-weight="700">NEW</text>
    <rect x="10" y="36" width="60" height="6" rx="2" fill="#fff" opacity="0.5"/>
  </g>
  <!-- arrow OUT -->
  <g transform="translate(50 200)">
    <path d="M 0 0 L 30 0 L 30 -8 L 50 5 L 30 18 L 30 10 L 0 10 Z" fill="#ec418c" transform="rotate(180 25 5)"/>
  </g>
  <text x="35" y="230" fill="#ec418c" font-family="Arial,sans-serif" font-weight="700" font-size="12">OUT</text>
  <!-- arrow IN -->
  <g transform="translate(540 200)">
    <path d="M 0 0 L 30 0 L 30 -8 L 50 5 L 30 18 L 30 10 L 0 10 Z" fill="#214098"/>
  </g>
  <text x="555" y="230" fill="#214098" font-family="Arial,sans-serif" font-weight="700" font-size="12">IN</text>
  <!-- title -->
  <text x="300" y="80" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-weight="700" font-size="34">FIFO</text>
  <text x="300" y="110" text-anchor="middle" fill="#ec418c" font-family="Arial,sans-serif" font-weight="700" font-size="14">First In · First Out</text>
  <!-- label tag -->
  <g transform="translate(280 320)">
    <path d="M 0 0 L 100 0 L 110 12 L 100 24 L 0 24 Z" fill="#fff" stroke="#214098" stroke-width="2"/>
    <circle cx="14" cy="12" r="3" fill="#214098"/>
    <text x="60" y="17" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-weight="700" font-size="11">DATA + ORA</text>
  </g>
</svg>

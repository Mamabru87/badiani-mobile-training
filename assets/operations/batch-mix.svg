<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Batch mix preparation">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#fff5f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgB)"/>
  <!-- mixing bowl -->
  <g transform="translate(300 220)">
    <ellipse cx="0" cy="0" rx="120" ry="30" fill="#214098"/>
    <path d="M -120 0 Q -100 110 0 110 Q 100 110 120 0 Z" fill="#fff" stroke="#214098" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="110" ry="22" fill="#f2be58"/>
    <ellipse cx="-30" cy="-4" rx="14" ry="4" fill="#fff" opacity="0.5"/>
    <ellipse cx="40" cy="-2" rx="10" ry="3" fill="#fff" opacity="0.5"/>
  </g>
  <!-- whisk -->
  <g transform="translate(290 90) rotate(-15)">
    <rect x="-4" y="0" width="8" height="100" rx="3" fill="#214098"/>
    <rect x="-7" y="-12" width="14" height="14" rx="3" fill="#ec418c"/>
    <g stroke="#214098" stroke-width="2.5" fill="none">
      <path d="M -4 100 Q -22 130 -4 160"/>
      <path d="M 4 100 Q 22 130 4 160"/>
      <path d="M 0 100 Q -10 130 0 160"/>
      <path d="M 0 100 Q 10 130 0 160"/>
    </g>
  </g>
  <!-- containers with labels -->
  <g font-family="Arial,sans-serif" font-weight="700">
    <g transform="translate(70 280)">
      <rect width="100" height="80" rx="8" fill="#fff" stroke="#214098" stroke-width="3"/>
      <rect x="6" y="6" width="88" height="22" rx="3" fill="#ec418c"/>
      <text x="50" y="22" text-anchor="middle" fill="#fff" font-size="11">CREPE</text>
      <text x="50" y="50" text-anchor="middle" fill="#214098" font-size="10">3 gg</text>
      <text x="50" y="70" text-anchor="middle" fill="#214098" font-size="9">FIFO</text>
    </g>
    <g transform="translate(440 280)">
      <rect width="100" height="80" rx="8" fill="#fff" stroke="#214098" stroke-width="3"/>
      <rect x="6" y="6" width="88" height="22" rx="3" fill="#214098"/>
      <text x="50" y="22" text-anchor="middle" fill="#fff" font-size="11">PANCAKE</text>
      <text x="50" y="50" text-anchor="middle" fill="#214098" font-size="10">2 gg</text>
      <text x="50" y="70" text-anchor="middle" fill="#214098" font-size="9">FIFO</text>
    </g>
  </g>
  <!-- title -->
  <text x="300" y="50" text-anchor="middle" fill="#214098" font-family="Arial,sans-serif" font-weight="700" font-size="22">BATCH MIX</text>
  <text x="300" y="70" text-anchor="middle" fill="#ec418c" font-family="Arial,sans-serif" font-weight="700" font-size="12">Etichetta · FIFO · Shelf life</text>
</svg>

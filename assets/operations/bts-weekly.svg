<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Weekly cleaning checklist">
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgW)"/>
  <!-- calendar -->
  <rect x="120" y="80" width="240" height="240" rx="18" fill="#fff" stroke="#214098" stroke-width="3"/>
  <rect x="120" y="80" width="240" height="44" rx="18" fill="#214098"/>
  <circle cx="160" cy="78" r="10" fill="#214098"/>
  <circle cx="320" cy="78" r="10" fill="#214098"/>
  <rect x="155" y="60" width="10" height="30" rx="4" fill="#214098"/>
  <rect x="315" y="60" width="10" height="30" rx="4" fill="#214098"/>
  <text x="240" y="111" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="20">WEEKLY</text>
  <!-- days grid -->
  <g font-family="Arial,sans-serif" font-size="16" fill="#214098">
    <text x="155" y="160">L</text><text x="195" y="160">M</text><text x="235" y="160">M</text><text x="275" y="160">G</text><text x="315" y="160">V</text>
  </g>
  <g>
    <circle cx="160" cy="195" r="14" fill="#ec418c"/><text x="160" y="201" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">✓</text>
    <circle cx="200" cy="195" r="14" fill="#ec418c"/><text x="200" y="201" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">✓</text>
    <circle cx="240" cy="195" r="14" fill="#f2be58"/><text x="240" y="201" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">✓</text>
    <circle cx="280" cy="195" r="14" fill="#f2be58"/><text x="280" y="201" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">✓</text>
    <circle cx="320" cy="195" r="14" fill="#cfd6e8"/>
  </g>
  <g>
    <line x1="150" y1="240" x2="330" y2="240" stroke="#cfd6e8" stroke-width="2"/>
    <line x1="150" y1="265" x2="310" y2="265" stroke="#cfd6e8" stroke-width="2"/>
    <line x1="150" y1="290" x2="290" y2="290" stroke="#cfd6e8" stroke-width="2"/>
  </g>
  <!-- broom -->
  <g transform="translate(420 130) rotate(20)">
    <rect x="0" y="0" width="8" height="140" fill="#214098" rx="4"/>
    <path d="M -25 130 L 33 130 L 45 200 L -37 200 Z" fill="#f2be58" stroke="#214098" stroke-width="2"/>
    <line x1="-15" y1="140" x2="-22" y2="195" stroke="#214098" stroke-width="2"/>
    <line x1="0" y1="140" x2="0" y2="200" stroke="#214098" stroke-width="2"/>
    <line x1="15" y1="140" x2="25" y2="195" stroke="#214098" stroke-width="2"/>
  </g>
  <!-- sparkles -->
  <g fill="#ec418c">
    <circle cx="450" cy="100" r="6"/>
    <circle cx="490" cy="140" r="4"/>
    <circle cx="510" cy="80" r="3"/>
  </g>
</svg>

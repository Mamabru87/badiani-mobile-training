<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Shelf life rapidi">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#fff5f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgS)"/>
  <!-- big clock -->
  <g transform="translate(160 200)">
    <circle r="100" fill="#fff" stroke="#214098" stroke-width="6"/>
    <g stroke="#214098" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-90" x2="0" y2="-78"/>
      <line x1="0" y1="78" x2="0" y2="90"/>
      <line x1="-90" y1="0" x2="-78" y2="0"/>
      <line x1="78" y1="0" x2="90" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#214098" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="0" stroke="#ec418c" stroke-width="4" stroke-linecap="round"/>
    <circle r="8" fill="#214098"/>
  </g>
  <!-- tags stack -->
  <g font-family="Arial,sans-serif" font-weight="700">
    <g transform="translate(310 90)">
      <path d="M 0 0 L 200 0 L 220 22 L 200 44 L 0 44 Z" fill="#ec418c"/>
      <circle cx="14" cy="22" r="5" fill="#fff"/>
      <text x="32" y="20" fill="#fff" font-size="13">CREPE MIX</text>
      <text x="32" y="36" fill="#fff" font-size="10" opacity="0.9">3 giorni · frigo · riposo 2h</text>
    </g>
    <g transform="translate(310 150)">
      <path d="M 0 0 L 200 0 L 220 22 L 200 44 L 0 44 Z" fill="#f2be58"/>
      <circle cx="14" cy="22" r="5" fill="#fff"/>
      <text x="32" y="20" fill="#214098" font-size="13">WAFFLE MIX</text>
      <text x="32" y="36" fill="#214098" font-size="10" opacity="0.9">2 giorni · pre-packed</text>
    </g>
    <g transform="translate(310 210)">
      <path d="M 0 0 L 200 0 L 220 22 L 200 44 L 0 44 Z" fill="#214098"/>
      <circle cx="14" cy="22" r="5" fill="#fff"/>
      <text x="32" y="20" fill="#fff" font-size="13">PANCAKE MIX</text>
      <text x="32" y="36" fill="#fff" font-size="10" opacity="0.9">2 giorni · frigo</text>
    </g>
    <g transform="translate(310 270)">
      <path d="M 0 0 L 200 0 L 220 22 L 200 44 L 0 44 Z" fill="#ec418c"/>
      <circle cx="14" cy="22" r="5" fill="#fff"/>
      <text x="32" y="20" fill="#fff" font-size="13">HOT CHOC MIX</text>
      <text x="32" y="36" fill="#fff" font-size="10" opacity="0.9">1 giorno · post prep</text>
    </g>
  </g>
